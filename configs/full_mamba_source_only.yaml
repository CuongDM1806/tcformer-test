# Pure source-only LOSO baseline:
# multi-kernel convolution -> full Mamba -> grouped TCN -> classifier.
# No target-domain samples are used for training or checkpoint selection.
dataset_name: ""
subject_ids: "all"
max_epochs: 500
max_epochs_2b: 500
max_epochs_loso: 125
max_epochs_loso_hgd: 77
max_epochs_loso_zhou2016: 100
seed: 0
requires_loso: true
domain_adaptation: false

z_scale: true
interaug: true
preprocessing:
  bcic2a:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    riemannian_alignment: false
  bcic2b:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: -0.5
    batch_size: 48
    riemannian_alignment: false
    num_workers: 2
    test_num_workers: 0
  zhou2016:
    sfreq: 250
    # Focus feature learning on the MI mu/beta range.
    low_cut: 8.0
    high_cut: 30.0
    z_scale: true
    # Exclude the first 0.5 s cue transient and retain 0.5--5.0 s.
    start: 0.5
    trial_duration: 4.5
    batch_size: 32
    num_workers: 2
    test_num_workers: 0
    validation_fraction: 0.20
    riemannian_alignment: false
    interaug: false
    model_overrides:
      lr: 0.001
      weight_decay: 0.0001

model: "FullMambaSourceOnly"
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  use_group_attn: true

  # Every sequence block is a lightweight selective-SSM/Mamba block.
  trans_depth: 5
  trans_dropout: 0.4
  sequence_block_types: [mamba_forward, mamba_backward, mamba_forward, mamba_backward, mamba_forward]
  mamba_d_state: 8
  mamba_d_conv: 3
  # Hoist state-independent work out of the recurrent time loop.
  mamba_scan_mode: hoisted

  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3

  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
