# Run with: python train_pipeline.py --model hada_tcformer --dataset bcic2a --loso
dataset_name: ""
subject_ids: "all"
max_epochs: 500
max_epochs_2b: 500
max_epochs_loso: 125
max_epochs_loso_hgd: 77
max_epochs_loso_zhou2016: 100
seed: 0
requires_loso: true
domain_adaptation: true

z_scale: true
interaug: true
preprocessing:
  bcic2a:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    # Per-subject OAS covariance + affine-invariant Riemannian whitening.
    # Each whitener is fit on that subject's training session only.
    riemannian_alignment: true
  bcic2b:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: -0.5
    batch_size: 48
  bcic3:
    sfreq: 100
    low_cut: 0
    high_cut: 40
    start: 0.0
    stop: 0.0
    batch_size: 28
    channel_selection: true
  hgd:
    sfreq: 250
    low_cut: 4
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    remove_artifacts: true
  physionet:
    # First 20 PhysioNet EEGMMIDB subjects; four imagined movement classes.
    sfreq: 160
    # Raw voltage: no microvolt scaling and no frequency filtering.
    low_cut: null
    high_cut: null
    z_scale: false
    # Full annotated task interval: one 4.1-second epoch from cue onset.
    # This is an experimental full-trial setting, not the 0-3 s MOABB window.
    start: 0.0
    trial_duration: 4.1
    # T4-safe micro-batch. Two accumulated steps preserve effective BS=96.
    batch_size: 48
    accumulate_grad_batches: 2
    num_workers: 2
    test_num_workers: 0
    # PhysioNet occasionally returns transient HTTP 5xx responses on Kaggle.
    download_retries: 8
    download_retry_delay_seconds: 5
    # Per-source split: 95% training, 5% source-only validation.
    validation_fraction: 0.05
    # Disabled by default: 64-channel Riemannian means are expensive.
    riemannian_alignment: false
    # Keep the IM-TTA implementation available, but skip it for PhysioNet.
    model_overrides:
      im_tta_steps: 0

  zhou2016:
    # Zhou et al. (2016): 14 EEG channels, 250 Hz, 3 MI classes.
    sfreq: 250
    low_cut: null
    high_cut: null
    z_scale: true
    start: 0.0
    trial_duration: 5.0
    batch_size: 32
    num_workers: 2
    test_num_workers: 0
    # Fit source references on sessions 1--2 and the target reference on its
    # unlabeled sessions 1--2; apply the frozen transforms to session 3.
    riemannian_alignment: true
    interaug: false
    model_overrides:
      lr: 0.001
      weight_decay: 0.0001

model: "HADATCFormer"
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  use_group_attn: true
  # Legacy names retained by TCFormerModule for sequence depth and dropout.
  # q_heads/kv_heads are intentionally omitted because this stack has no GQA.
  trans_depth: 5
  trans_dropout: 0.4
  # Full five-block lightweight Mamba-style encoder. Alternating scan direction
  # gives both temporal directions without doubling each block's parameters.
  sequence_block_types: [mamba_forward, mamba_backward, mamba_forward, mamba_backward, mamba_forward]
  mamba_d_state: 8
  mamba_d_conv: 3
  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3

  aligner_hidden_dim: 128
  domain_hidden_dim: 128
  adaptation_dropout: 0.3
  adversarial_weight: 1.0
  mmd_weight: 0.5
  temporal_mmd_weight: 0.1
  # High-gap, low-confidence target subjects use 25% of all DA losses.
  light_adaptation_factor: 0.25
  # (A) GRL gradient routing. The discriminator still sees the aligned
  # features and the backbone always receives the full reversed gradient;
  # only the global aligner's share is scaled by rho in [0, 1].
  #   none -> rho = 1 (Full-Mamba), fixed -> rho = grl_aligner_rho,
  #   gap  -> rho = clamp(gap_EMA / grl_routing_tau, 0, 1), where gap is the
  #           normalized source-target center distance of the pooled
  #           backbone features (before the aligner).
  grl_routing: gap
  grl_aligner_rho: 1.0
  grl_routing_tau: 1.0
  # (B) Group-preserving residual path in parallel with the global aligner.
  # It never receives the adversarial gradient (CE + MMD only); its per-group
  # scales start at 0, so training starts from the Full-Mamba model.
  group_aligner: true
  group_aligner_hidden_dim: 8
  # Source-free target adaptation after HADA training. Only BatchNorm affine
  # parameters are updated; target labels are never read.
  im_tta_steps: 5
  im_tta_lr: 0.0001
  im_tta_diversity_weight: 1.0
  log_every_n_batches: 5

  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
