# Run with: python train_pipeline.py --model hada_tcformer --dataset bcic2a --loso
dataset_name: ""
subject_ids: "all"
max_epochs: 500
max_epochs_2b: 500
max_epochs_loso: 125
max_epochs_loso_hgd: 77
max_epochs_loso_zhou2016: 100
seed: 0
requires_loso: true
domain_adaptation: true
# Also score each fold without IM-TTA (same trained weights, AutoDIAL target
# statistics still re-estimated), giving the "without test-time adaptation"
# ablation from the same run.
evaluate_without_im_tta: false

z_scale: true
interaug: true
preprocessing:
  bcic2a:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    # Per-subject OAS covariance + affine-invariant Riemannian whitening.
    # Each whitener is fit on that subject's training session only.
    riemannian_alignment: true
  bcic2b:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: -0.5
    batch_size: 48
    # Strict per-subject RA: fit each source reference on sessions 1--3 and
    # the target reference on its unlabeled sessions 1--3. Sessions 4--5 are
    # transformed with the corresponding frozen reference for evaluation.
    riemannian_alignment: true
  bcic3:
    sfreq: 100
    low_cut: 0
    high_cut: 40
    start: 0.0
    stop: 0.0
    batch_size: 28
    channel_selection: true
  hgd:
    sfreq: 250
    low_cut: 4
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    remove_artifacts: true
  physionet:
    # PhysioNet EEGMMIDB subjects 1..109 (minus the 128-Hz recordings);
    # four imagined movement classes. Same data protocol as the source-only
    # runs of feature/full-mamba-source-only-physionet109.
    sfreq: 160
    # Raw voltage: no microvolt scaling and no frequency filtering.
    low_cut: null
    high_cut: null
    z_scale: false
    # Full annotated task interval: one 4.1-second epoch from cue onset.
    start: 0.0
    trial_duration: 4.1
    # Source and target batches share one forward pass, so a T4 runs
    # 54 + 54 trials per step; two accumulated steps give an effective 108,
    # the batch size of the source-only runs.
    batch_size: 54
    accumulate_grad_batches: 2
    num_workers: 2
    test_num_workers: 0
    # PhysioNet occasionally returns transient HTTP 5xx responses on Kaggle.
    download_retries: 8
    download_retry_delay_seconds: 5
    # Per-source split: 95% training, 5% source-only validation.
    validation_fraction: 0.05
    # Full system: strict per-subject RA. Each source reference is fit on that
    # source's training trials; the target reference uses the target's
    # unlabeled imagery trials (PhysioNet has a single session).
    riemannian_alignment: true
    # Drop trials truncated by the end of a run (at most 3 of 15 per run).
    accepted_bads_ratio: 0.2
    # Recorded at 128 Hz with 5.125-s trials and 12 or 19 trials per run,
    # inconsistent with the 160-Hz, 4.1-s, 15-trial protocol of the others.
    exclude_subject_ids: [88, 92, 100]
  zhou2016:
    # Zhou et al. (2016): 14 EEG channels, 250 Hz, 3 MI classes.
    sfreq: 250
    # Match the motor-imagery preprocessing used in the original study:
    # retain the mu/beta range and exclude the first 0.5 s after cue onset.
    # This also keeps the RA covariance reference focused on MI activity
    # instead of broadband drift, cue transients, and high-frequency noise.
    low_cut: 8.0
    high_cut: 30.0
    z_scale: true
    start: 0.5
    trial_duration: 4.5
    batch_size: 32
    num_workers: 2
    test_num_workers: 0
    # Fit source references on sessions 1--2 and the target reference on its
    # unlabeled sessions 1--2; apply the frozen transforms to session 3.
    riemannian_alignment: true
    interaug: false
    model_overrides:
      lr: 0.001
      weight_decay: 0.0001

model: "HADATCFormer"
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  use_group_attn: true
  # Legacy names retained by TCFormerModule for sequence depth and dropout.
  # q_heads/kv_heads are intentionally omitted because this stack has no GQA.
  trans_depth: 5
  trans_dropout: 0.4
  # Full five-block lightweight Mamba-style encoder. Alternating scan direction
  # gives both temporal directions without doubling each block's parameters.
  sequence_block_types: [mamba_forward, mamba_backward, mamba_forward, mamba_backward, mamba_forward]
  mamba_d_state: 8
  mamba_d_conv: 3
  # Scripted scan with state-independent work hoisted out of the time loop
  # and the depthwise conv as shifted multiply-adds (pure PyTorch, no custom
  # CUDA kernel). Same function as the per-step scan; lowest CPU latency.
  mamba_scan_mode: hoisted
  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3

  # AutoDIAL feature normalization (Carlucci et al., ICCV 2017): the target is
  # standardized with alpha * target + (1 - alpha) * source statistics, with
  # one learned alpha per feature group. alpha -> 1 behaves like DSBN (large
  # session/subject shift, e.g. Zhou2016); alpha -> 0 keeps source statistics.
  # The same setting is used for every dataset. "none" restores HADA exactly.
  feature_alignment: autodial
  autodial_alpha_init: 0.5
  domain_norm_momentum: 0.1
  # Target InfoMax during training; the only signal that updates alpha.
  target_im_weight: 0.1
  # Re-estimate AutoDIAL target statistics after IM-TTA on the same trials.
  recalibrate_target_statistics: true
  # The residual aligner stays after AutoDIAL as a safe correction path.
  aligner_hidden_dim: 128
  domain_hidden_dim: 128
  adaptation_dropout: 0.3
  adversarial_weight: 1.0
  mmd_weight: 0.5
  temporal_mmd_weight: 0.1
  # 1.0 disables the confidence-discrepancy gate (removed from the paper).
  light_adaptation_factor: 1.0
  # Source-free target adaptation after HADA training. Only BatchNorm affine
  # parameters are updated; target labels are never read.
  im_tta_steps: 5
  im_tta_lr: 0.0001
  im_tta_diversity_weight: 1.0
  log_every_n_batches: 5

  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
