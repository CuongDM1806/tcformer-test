# Run with: python train_pipeline.py --model hada_tcformer --dataset bcic2a --loso
dataset_name: ""
subject_ids: "all"
max_epochs: 500
max_epochs_2b: 500
max_epochs_loso: 125
max_epochs_loso_hgd: 77
max_epochs_loso_zhou2016: 100
seed: 0
requires_loso: true
domain_adaptation: true

z_scale: true
interaug: true
preprocessing:
  bcic2a:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    # Per-subject OAS covariance + affine-invariant Riemannian whitening.
    # Each whitener is fit on that subject's training session only.
    riemannian_alignment: true
  bcic2b:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: -0.5
    batch_size: 48
    # Per-subject RA. Each reference is fit on sessions 1-3 only; target
    # sessions 4-5 are transformed with the frozen target reference.
    riemannian_alignment: true
    num_workers: 2
    test_num_workers: 0
  bcic3:
    sfreq: 100
    low_cut: 0
    high_cut: 40
    start: 0.0
    stop: 0.0
    batch_size: 28
    channel_selection: true
  hgd:
    sfreq: 250
    low_cut: 4
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    remove_artifacts: true
  physionet:
    # First 20 PhysioNet EEGMMIDB subjects; four imagined movement classes.
    sfreq: 160
    # Raw voltage: no microvolt scaling and no frequency filtering.
    low_cut: null
    high_cut: null
    z_scale: false
    # Full annotated task interval: one 4.1-second epoch from cue onset.
    # This is an experimental full-trial setting, not the 0-3 s MOABB window.
    start: 0.0
    trial_duration: 4.1
    # T4-safe micro-batch. Two accumulated steps preserve effective BS=96.
    batch_size: 48
    accumulate_grad_batches: 2
    num_workers: 2
    test_num_workers: 0
    # PhysioNet occasionally returns transient HTTP 5xx responses on Kaggle.
    download_retries: 8
    download_retry_delay_seconds: 5
    # Per-source split: 95% training, 5% source-only validation.
    validation_fraction: 0.05
    # Disabled by default: 64-channel Riemannian means are expensive.
    riemannian_alignment: false
    # Keep the IM-TTA implementation available, but skip it for PhysioNet.
    model_overrides:
      im_tta_steps: 0

  zhou2016:
    # Zhou et al. (2016): 14 EEG channels, 250 Hz, 3 MI classes.
    sfreq: 250
    low_cut: null
    high_cut: null
    z_scale: true
    start: 0.0
    trial_duration: 5.0
    batch_size: 32
    num_workers: 2
    test_num_workers: 0
    # Fit source references on sessions 1--2 and the target reference on its
    # unlabeled sessions 1--2; apply the frozen transforms to session 3.
    riemannian_alignment: true
    interaug: false
    model_overrides:
      lr: 0.001
      weight_decay: 0.0001

model: "HADATCFormer"
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  use_group_attn: true
  # Legacy names retained by TCFormerModule for sequence depth and dropout.
  # q_heads/kv_heads are intentionally omitted because this stack has no GQA.
  trans_depth: 5
  trans_dropout: 0.4
  # Full five-block lightweight Mamba-style encoder. Alternating scan direction
  # gives both temporal directions without doubling each block's parameters.
  sequence_block_types: [mamba_forward, mamba_backward, mamba_forward, mamba_backward, mamba_forward]
  mamba_d_state: 8
  mamba_d_conv: 3
  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3

  # (1) Domain-specific normalization: separate source/target statistics per
  # feature channel with a shared affine. "residual" restores the Lite-DA
  # group-wise residual aligner (uses aligner_hidden_dim) for ablations.
  feature_alignment: group_dsbn
  domain_norm_momentum: 0.1
  # Re-estimate target statistics on the unlabeled evaluation trials after
  # IM-TTA, the same transductive data IM-TTA already uses.
  recalibrate_target_statistics: true
  aligner_hidden_dim: 8
  # (2) Zero-gated low-rank cross-group mixer; 0 disables it.
  cross_group_rank: 0
  # Small discriminator: 64 -> 32 -> 1, on standardized features.
  domain_hidden_dim: 32
  adaptation_dropout: 0.3
  adversarial_weight: 1.0
  # (3) Scale the reversed gradient by EMA balanced discriminator accuracy:
  # 0.5 (domains inseparable) -> 0, 1.0 -> full strength.
  adaptive_adversary: true
  adversary_ema_decay: 0.95
  # A single pooled-feature MK-MMD; (4) temporal MMD stays disabled.
  mmd_weight: 0.5
  # Source-free target adaptation after HADA training. Only BatchNorm affine
  # parameters are updated; target labels are never read.
  im_tta_steps: 5
  im_tta_lr: 0.0001
  im_tta_diversity_weight: 1.0
  log_every_n_batches: 5

  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
