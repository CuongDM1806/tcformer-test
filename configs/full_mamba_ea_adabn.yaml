# Best-source-validation Full-Mamba with EEG-SimpleConv-style target adaptation.
# Source supervised training -> session-wise EA -> target AdaBN -> IM-TTA.
# No MMD, temporal MMD, discriminator, GRL, or trainable feature aligner.
dataset_name: ""
subject_ids: "all"
max_epochs: 500
max_epochs_2b: 500
max_epochs_loso: 125
max_epochs_loso_hgd: 77
max_epochs_loso_zhou2016: 100
seed: 0
requires_loso: true
domain_adaptation: false

z_scale: true
interaug: true
preprocessing:
  bcic2a:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    num_workers: 2
    test_num_workers: 0
    euclidean_alignment: true
    riemannian_alignment: false
  bcic2b:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: -0.5
    batch_size: 48
    num_workers: 2
    test_num_workers: 0
    euclidean_alignment: true
    riemannian_alignment: false
  zhou2016:
    sfreq: 250
    low_cut: null
    high_cut: null
    z_scale: true
    start: 0.0
    trial_duration: 5.0
    batch_size: 32
    num_workers: 2
    test_num_workers: 0
    validation_fraction: 0.20
    euclidean_alignment: true
    riemannian_alignment: false
    interaug: false
    model_overrides:
      lr: 0.001
      weight_decay: 0.0001

model: "FullMambaEAdaBN"
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  use_group_attn: true

  trans_depth: 5
  trans_dropout: 0.4
  sequence_block_types: [mamba_forward, mamba_backward, mamba_forward, mamba_backward, mamba_forward]
  mamba_d_state: 8
  mamba_d_conv: 3

  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3

  # Target labels are never read. AdaBN always runs; these parameters retain
  # the best-val branch's information-maximization test-time adaptation.
  im_tta_steps: 5
  im_tta_lr: 0.0001
  im_tta_diversity_weight: 1.0

  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
