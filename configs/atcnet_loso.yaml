# ATCNet baseline (Altaheri et al., IEEE TII 2023).
# Same pure source-only LOSO protocol as SSM-DAN (source-only), the original
# TCFormer, EEGEncoder and SATrans-Net: identical splits and preprocessing
# per dataset, best source-validation checkpoint, no target samples, no RA,
# no domain adaptation, no test-time adaptation. Model and optimizer settings
# are those of configs/atcnet.yaml (TCFormer reference implementation).
dataset_name: ""
subject_ids: "all"
max_epochs: 1000
max_epochs_2b: 1000
max_epochs_loso: 125
max_epochs_loso_zhou2016: 100
seed: 0
requires_loso: true
domain_adaptation: false

z_scale: true
interaug: true
preprocessing:
  bcic2a:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: 0.0
    batch_size: 48
    riemannian_alignment: false
  bcic2b:
    sfreq: 250
    low_cut: null
    high_cut: null
    start: 0.0
    stop: -0.5
    batch_size: 48
    riemannian_alignment: false
    num_workers: 2
    test_num_workers: 0
  zhou2016:
    sfreq: 250
    # Same MI-focused Zhou2016 preprocessing as every method in the paper.
    low_cut: 8.0
    high_cut: 30.0
    z_scale: true
    # Exclude the initial cue transient and retain the 0.5--5.0 s MI interval.
    start: 0.5
    trial_duration: 4.5
    batch_size: 48
    num_workers: 2
    test_num_workers: 0
    validation_fraction: 0.20
    riemannian_alignment: false
    interaug: false

model: "ATCNet"
model_kwargs:
  F1: 16
  kernel_length_conv: 64
  pool_length: 8
  D: 2
  dropout_conv: 0.3
  d_model: 32
  key_dim: 8
  n_head: 2
  dropout_attn: 0.5
  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3
  n_windows: 5

  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: "adam"
  scheduler: true
  warmup_epochs: 20
  warmup_epochs_loso: 3
