description: >-
  TCFormer (Altaheri et al., Sci. Rep. 2025), the unmodified upstream network, source-only: no RA,
  no target data, no test-time adaptation; best source-validation checkpoint.
model: TCFormer
preprocessing: {batch_size: 48, riemannian_alignment: false}
model_kwargs:
  F1: 32
  temp_kernel_lengths: [20, 32, 64]
  d_group: 16
  D: 2
  pool_length_1: 8
  pool_length_2: 7
  dropout_conv: 0.4
  use_group_attn: true
  q_heads: 4
  kv_heads: 2
  trans_depth: 5
  trans_dropout: 0.4
  tcn_depth: 2
  kernel_length_tcn: 4
  dropout_tcn: 0.3
  lr: 0.0009
  beta_1: 0.5
  weight_decay: 0.001
  optimizer: adam
  scheduler: true
  warmup_epochs: 3
datasets:
  bcic2a: {}
  bcic2b: {}
  zhou2016:
    preprocessing: {batch_size: 32}
    model_kwargs: {lr: 0.001, weight_decay: 0.0001}
