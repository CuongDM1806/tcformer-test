<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc HADA-TCFormer hiện tại</title>
  <desc id="desc">Sơ đồ chi tiết luồng source có nhãn và target không nhãn qua TCFormer, residual feature aligner, classifier, gradient reversal, domain discriminator và MK-MMD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="cnn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="trans" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="adapt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="loss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#881337"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#9fb4ce"/>
    </marker>
    <marker id="arrowGold" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#fb7185"/>
    </marker>
    <style>
      .title { font: 700 31px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #aebed2; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; letter-spacing: .5px; }
      .box-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .box-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .shape { font: 600 12px Consolas, monospace; fill: #fde68a; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #b8c7d9; }
      .tiny { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #b8c7d9; }
      .card { stroke: #3a4a63; stroke-width: 1.3; rx: 13; filter: url(#shadow); }
      .arrow { fill: none; stroke: #9fb4ce; stroke-width: 2.3; marker-end: url(#arrow); }
      .gold-arrow { fill: none; stroke: #fbbf24; stroke-width: 2.4; marker-end: url(#arrowGold); }
      .red-arrow { fill: none; stroke: #fb7185; stroke-width: 2.4; marker-end: url(#arrowRed); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="url(#bg)"/>
  <text x="70" y="57" class="title">HADA–TCFormer: sơ đồ kết nối theo code hiện tại</text>
  <text x="70" y="84" class="subtitle">Cấu hình minh họa: BCIC2a · 22 điện cực · 1000 mẫu · 4 lớp · target không dùng nhãn trong training</text>

  <!-- Inputs -->
  <text x="70" y="130" class="section">1 · DỮ LIỆU UDA</text>
  <rect x="70" y="150" width="250" height="104" fill="#0f4c5c" class="card"/>
  <text x="90" y="180" class="box-title">Source domain</text>
  <text x="90" y="205" class="box-text">EEG source xₛ + nhãn yₛ</text>
  <text x="90" y="229" class="shape">xₛ: [Bₛ, 22, 1000]</text>

  <rect x="70" y="280" width="250" height="104" fill="#6d3a13" class="card"/>
  <text x="90" y="310" class="box-title">Target domain</text>
  <text x="90" y="335" class="box-text">Chỉ EEG target xₜ</text>
  <text x="90" y="359" class="shape">xₜ: [Bₜ, 22, 1000]</text>

  <rect x="365" y="207" width="220" height="118" fill="#24334a" class="card"/>
  <text x="385" y="239" class="box-title">Ghép theo batch</text>
  <text x="385" y="266" class="box-text">torch.cat((xₛ, xₜ), dim=0)</text>
  <text x="385" y="292" class="shape">[Bₛ+Bₜ, 22, 1000]</text>
  <path d="M320 202 H345 Q355 202 355 218 V245 Q355 266 365 266" class="arrow"/>
  <path d="M320 332 H345 Q355 332 355 315 V286 Q355 266 365 266" class="arrow"/>

  <!-- Backbone container -->
  <rect x="625" y="120" width="1105" height="660" fill="#0b1526" stroke="#334763" stroke-width="1.5" rx="20"/>
  <text x="650" y="154" class="section">2 · SHARED TCFormer BACKBONE (cùng trọng số cho source và target)</text>
  <path d="M585 266 H625" class="arrow"/>

  <!-- CNN block -->
  <rect x="655" y="182" width="300" height="560" fill="url(#cnn)" class="card"/>
  <text x="680" y="217" class="box-title">Multi-Kernel Conv Block</text>
  <text x="680" y="244" class="shape">Input: [B, 22, 1000]</text>

  <rect x="680" y="268" width="250" height="106" fill="#083f3c" stroke="#4db6ac" rx="10"/>
  <text x="697" y="294" class="box-title">3 nhánh temporal Conv2D</text>
  <text x="697" y="318" class="box-text">kernel = 20, 32, 64 · F1 = 32</text>
  <text x="697" y="341" class="box-text">Concat theo channel</text>
  <text x="697" y="360" class="shape">[B, 96, 22, 1000]</text>

  <path d="M805 374 V394" class="arrow"/>
  <rect x="680" y="394" width="250" height="85" fill="#083f3c" stroke="#4db6ac" rx="10"/>
  <text x="697" y="421" class="box-title">Depth-wise spatial Conv</text>
  <text x="697" y="444" class="box-text">kernel (22,1), D=2 + BN + ELU</text>
  <text x="697" y="464" class="shape">[B, 192, 1, 1000]</text>

  <path d="M805 479 V499" class="arrow"/>
  <rect x="680" y="499" width="250" height="92" fill="#083f3c" stroke="#4db6ac" rx="10"/>
  <text x="697" y="526" class="box-title">Pool 8 + channel reduction</text>
  <text x="697" y="549" class="box-text">Grouped 1×1 Conv: 192 → 48</text>
  <text x="697" y="572" class="shape">[B, 48, 1, 125]</text>

  <path d="M805 591 V611" class="arrow"/>
  <rect x="680" y="611" width="250" height="101" fill="#083f3c" stroke="#4db6ac" rx="10"/>
  <text x="697" y="638" class="box-title">Grouped temporal Conv</text>
  <text x="697" y="661" class="box-text">kernel 16 + group attention residual</text>
  <text x="697" y="683" class="box-text">AvgPool 7 + Dropout</text>
  <text x="697" y="702" class="shape">conv: [B, 48, 17]</text>

  <!-- Transformer branch -->
  <rect x="995" y="182" width="330" height="420" fill="url(#trans)" class="card"/>
  <text x="1020" y="217" class="box-title">Transformer branch</text>
  <path d="M955 455 H975 Q985 455 985 435 V250 Q985 232 995 232" class="arrow"/>
  <text x="1020" y="248" class="small">Nhận chính conv features [B,48,17]</text>

  <rect x="1020" y="270" width="280" height="76" fill="#29236b" stroke="#8b83ea" rx="10"/>
  <text x="1037" y="297" class="box-title">Mix 1×1 Conv + BN + SiLU</text>
  <text x="1037" y="322" class="shape">Rearrange → tokens [B, 17, 48]</text>

  <path d="M1160 346 V368" class="arrow"/>
  <rect x="1020" y="368" width="280" height="116" fill="#29236b" stroke="#8b83ea" rx="10"/>
  <text x="1037" y="395" class="box-title">5 × Transformer Block</text>
  <text x="1037" y="420" class="box-text">Pre-LN → GQA + RoPE → residual</text>
  <text x="1037" y="443" class="box-text">Pre-LN → MLP (48→96→48) → residual</text>
  <text x="1037" y="466" class="box-text">q-heads=4 · kv-heads=2 · DropPath</text>

  <path d="M1160 484 V506" class="arrow"/>
  <rect x="1020" y="506" width="280" height="70" fill="#29236b" stroke="#8b83ea" rx="10"/>
  <text x="1037" y="533" class="box-title">Reduce 1×1 Conv: 48 → 16</text>
  <text x="1037" y="557" class="shape">transformer: [B, 16, 17]</text>

  <!-- Fusion and TCN -->
  <rect x="1360" y="210" width="330" height="108" fill="#253650" class="card"/>
  <text x="1382" y="242" class="box-title">Feature fusion</text>
  <text x="1382" y="268" class="box-text">Concat conv 48 + transformer 16</text>
  <text x="1382" y="293" class="shape">[B, 64, 17]</text>
  <path d="M930 680 H1335 Q1345 680 1345 650 V285 Q1345 264 1360 264" class="arrow"/>
  <path d="M1300 541 H1330 Q1345 541 1345 510 V285 Q1345 264 1360 264" class="arrow"/>

  <path d="M1525 318 V350" class="arrow"/>
  <rect x="1360" y="350" width="330" height="181" fill="#374151" class="card"/>
  <text x="1382" y="381" class="box-title">TCN · 2 residual blocks</text>
  <text x="1382" y="409" class="box-text">Block 1: 2× CausalConv1D, k=4, dilation=1</text>
  <text x="1382" y="434" class="box-text">Block 2: 2× CausalConv1D, k=4, dilation=2</text>
  <text x="1382" y="459" class="box-text">Mỗi conv: BN → ELU → Dropout</text>
  <text x="1382" y="484" class="box-text">Grouped theo 4 nhóm · residual từng block</text>
  <text x="1382" y="510" class="shape">Output: [B, 64, 17] · receptive field=19</text>

  <path d="M1525 531 V560" class="arrow"/>
  <rect x="1360" y="560" width="330" height="96" fill="#5b2434" stroke="#fb7185" class="card"/>
  <text x="1382" y="591" class="box-title">Temporal pooling cải tiến</text>
  <text x="1382" y="617" class="box-text">0.5 × (timestep cuối + temporal mean)</text>
  <text x="1382" y="641" class="shape">[B, 64, 17] → [B, 64] · 0 params</text>

  <path d="M1525 656 V687" class="arrow"/>
  <rect x="1360" y="687" width="330" height="68" fill="url(#adapt)" class="card"/>
  <text x="1382" y="715" class="box-title">Residual Feature Aligner</text>
  <text x="1382" y="739" class="shape">LN → 64→128→64 → LN; z + s·Δz</text>

  <!-- split -->
  <text x="70" y="831" class="section">3 · CÁC NHÁNH HUẤN LUYỆN SAU ALIGNMENT</text>
  <path d="M1525 755 V798 H900 V854" class="arrow"/>
  <rect x="770" y="854" width="260" height="80" fill="#24334a" class="card"/>
  <text x="792" y="884" class="box-title">Tách lại source / target</text>
  <text x="792" y="910" class="shape">zₛ: [Bₛ,64] · zₜ: [Bₜ,64]</text>

  <!-- Classification -->
  <path d="M840 934 V970 H430 V995" class="arrow"/>
  <rect x="235" y="995" width="390" height="130" fill="#155e75" class="card"/>
  <text x="260" y="1027" class="box-title">Classification head · chỉ source</text>
  <text x="260" y="1053" class="box-text">Grouped 1×1 Conv: 4 nhóm × 4 class logits</text>
  <text x="260" y="1077" class="box-text">Softmax 4 trọng số học được → logits [Bₛ,4]</text>
  <text x="260" y="1103" class="shape">L_cls = CrossEntropy(logitsₛ, yₛ)</text>

  <!-- MMD -->
  <path d="M900 934 V995" class="gold-arrow"/>
  <rect x="695" y="995" width="410" height="130" fill="#6b4b0c" stroke="#fbbf24" class="card"/>
  <text x="720" y="1027" class="box-title">Multi-Kernel MMD · zₛ ↔ zₜ</text>
  <text x="720" y="1053" class="box-text">L2 normalize → Gaussian kernels (5 bandwidths)</text>
  <text x="720" y="1077" class="box-text">MMD chính trên z + MMD phụ trên temporal mean</text>
  <text x="720" y="1103" class="shape">0.5 · L_mmd + 0.1 · L_temporal_mmd</text>

  <!-- GRL discriminator -->
  <path d="M960 934 V965 H1365 V995" class="red-arrow"/>
  <rect x="1175" y="995" width="380" height="130" fill="#632337" stroke="#fb7185" class="card"/>
  <text x="1200" y="1027" class="box-title">GRL → Domain Discriminator</text>
  <text x="1200" y="1053" class="box-text">GRL giữ nguyên forward, đảo gradient −α</text>
  <text x="1200" y="1077" class="box-text">MLP: 64→128→64→1 · source=0, target=1</text>
  <text x="1200" y="1103" class="shape">L_domain = BCEWithLogits(domain)</text>

  <!-- GPL prototype class alignment -->
  <path d="M900 934 V1142" class="gold-arrow"/>
  <rect x="650" y="1142" width="500" height="126" fill="#4c3b12" stroke="#facc15" class="card"/>
  <text x="675" y="1173" class="box-title">GPL local class alignment · 2 prototype banks</text>
  <text x="675" y="1198" class="box-text">Source bank: EMA prototypes from true source labels</text>
  <text x="675" y="1222" class="box-text">Target bank: pseudo-labels selected and weighted by entropy</text>
  <text x="675" y="1247" class="shape">0.1 · L_source_proto + 0.1 · L_interactive_proto</text>

  <!-- Total loss -->
  <path d="M430 1125 V1300 H900 V1322" class="arrow"/>
  <path d="M900 1268 V1322" class="gold-arrow"/>
  <path d="M1365 1125 V1300 H900 V1322" class="red-arrow"/>
  <rect x="500" y="1322" width="800" height="62" fill="url(#loss)" class="card"/>
  <text x="525" y="1360" class="box-title">TOTAL: classification + adversarial + global/temporal MMD + source/interactive prototype contrast</text>

  <!-- Side notes -->
  <rect x="70" y="445" width="500" height="277" fill="#111f34" stroke="#38506e" rx="14"/>
  <text x="94" y="480" class="box-title">Luồng gradient và suy luận</text>
  <text x="94" y="514" class="small">• L_cls cập nhật backbone + aligner + classifier.</text>
  <text x="94" y="544" class="small">• L_domain cập nhật discriminator để nhận diện domain.</text>
  <text x="94" y="574" class="small">• Qua GRL, backbone/aligner nhận gradient ngược để</text>
  <text x="111" y="596" class="small">tạo feature khó phân biệt source với target.</text>
  <text x="94" y="626" class="small">• L_mmd trực tiếp kéo phân phối zₛ và zₜ lại gần nhau.</text>
  <text x="94" y="660" class="small">• Khi test: target EEG → backbone → aligner → classifier.</text>
  <text x="94" y="690" class="small">• GRL, discriminator và MMD không dùng khi inference.</text>

  <text x="70" y="1402" class="tiny">Nguồn: tcformer.py + hada_tcformer.py + hada_tcformer.yaml · Global MMD và GPL prototype class alignment có entropy gate.</text>
</svg>
